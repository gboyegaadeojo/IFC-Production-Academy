# Chat cleanup (ADD-MSG-05; docs/decisions/2026-11-08-team-messaging.md). Daily: removes chat
# photos and documents past the limit set on Admin -> Features (90 days unless changed), and those
# of deleted messages, then message text past its limit (3 years). The service-role key lives only
# in this repository's Actions secrets. The script logs counts only, never names, files, or words.
name: Chat cleanup

on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-cleanup
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            lib/domain/supabase-keys.ts
            scripts/chat-cleanup.ts
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Remove old chat files and messages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/chat-cleanup.ts

      - name: Email the admins
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          resend-api-key: ${{ secrets.RESEND_API_KEY }}
          to: ${{ secrets.ALERT_EMAILS }}
          from: ${{ secrets.ALERT_FROM }}
          subject: "IFC Academy: chat cleanup failed"

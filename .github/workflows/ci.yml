# Continuous integration. Uses no secrets: everything runs against a local Supabase stack with
# fake data, so it is safe for pull requests from forks.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, format, unit tests, Cloudflare build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: New migrations are dated after the newest on main
        # Migrations already applied to production are dated in the future and are never renamed,
        # so a new one must come after all of them (CLAUDE.md, "Migrations").
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE"
          else
            echo "No earlier commit to compare with."
            exit 0
          fi
          node scripts/check-migration-order.ts FETCH_HEAD
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - name: Build for Cloudflare Workers
        run: npm run cf:build
        env:
          # Placeholders: this checks the build, it does not deploy.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
      - name: Smoke test the Worker in local workerd
        # A build can succeed and still produce a Worker that hangs on every request.
        run: |
          set -euo pipefail
          npx wrangler dev --local --test-scheduled --port 8799 --var LIVE_ROOM_SECRET:fake-smoke-secret > /tmp/wrangler-dev.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -s -o /dev/null --max-time 2 http://127.0.0.1:8799/favicon.ico && break
            sleep 2
          done
          failed=0
          for path in /sign-in /dev/tokens; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "http://127.0.0.1:8799$path" || true)"
            echo "$path -> $code"
            case "$path:$code" in
              /sign-in:200 | /dev/tokens:404) ;;
              *) failed=1 ;;
            esac
          done
          if [ "$failed" -ne 0 ]; then
            grep -E 'ERROR|hung|is not a function' /tmp/wrangler-dev.log | head -20 || true
            exit 1
          fi
          # The live room (ADD-DASH-09), end to end, with fake readings.
          node scripts/live-room-smoke.mjs http://127.0.0.1:8799 fake-smoke-secret
          # The timer that starts the frequent jobs. With no token here, it calls nothing.
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "http://127.0.0.1:8799/__scheduled?cron=*/15+*+*+*+*" || true)"
          echo "scheduled -> $code"
          if [ "$code" != "200" ]; then
            exit 1
          fi

  database-and-e2e:
    name: RLS tests and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Storage stays on: SOP files are uploaded and opened in the end-to-end tests.
      - name: Start local Supabase (migrations and fake seed data)
        run: npx supabase start -x realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Database tests (pgTAP, row-level security)
        run: npx supabase test db

      - name: Point the app at the local stack
        run: |
          set -euo pipefail
          status="$(npx supabase status -o json 2>/dev/null | sed -n '/^{/,/^}/p')"
          api_url="$(jq -r '.API_URL' <<<"$status")"
          key="$(jq -r '.PUBLISHABLE_KEY // .ANON_KEY' <<<"$status")"
          echo "::add-mask::$key"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$api_url"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$key"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
          } >> "$GITHUB_ENV"

      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      # Design review screenshots (e2e/visual.spec.ts). They show only fake seed data and generated
      # example.com accounts, never real people. Kept for a week.
      - name: Upload design screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: design-screenshots
          path: test-results/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup

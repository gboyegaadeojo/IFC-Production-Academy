<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messaging mock B: Uber-inspired</title>
<link rel="stylesheet" href="mock.css">
<style>
/* Option B, inspired by the feel of Uber's app: bold black and white, large confident headings, flat
   surfaces, one strong accent, a tight grid, and big tap targets. No Uber logos, icons or screens;
   the Academy's purple is the one accent and department colours stay on avatars. */
.frame[data-theme="light"] {
  --bg: #ffffff; --surface: #ffffff; --chip: #eeeeee; --hover: #f3f3f3; --line: #e2e2e2;
  --text: #000000; --text-2: #333333; --muted: #6b6b6b;
  --ink: #000000; --ink-on: #ffffff; --accent: #6d3fe0; --accent-ink: #ffffff; --accent-text: #5b2fd0;
  --danger: #c4161c;
}
.frame[data-theme="dark"] {
  --bg: #000000; --surface: #000000; --chip: #1f1f1f; --hover: #141414; --line: #2e2e2e;
  --text: #ffffff; --text-2: #e2e2e2; --muted: #a6a6a6;
  --ink: #ffffff; --ink-on: #000000; --accent: #8f5cff; --accent-ink: #ffffff; --accent-text: #b69bff;
  --danger: #ff6a63;
}
.frame { --font: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif; font-size: 15px; }

/* Flat chrome with hard edges */
.app-top { padding: 16px; border-bottom: 1px solid var(--line); }
.brand { font-size: 14px; font-weight: 800; letter-spacing: -.01em; }
.brand-mark { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; background: var(--ink); color: var(--ink-on); font-size: 10px; font-weight: 900; }
.tabs { border-top: 1px solid var(--line); background: var(--bg); padding-bottom: 20px; }
.tab { color: var(--muted); font-size: 11px; font-weight: 600; }
.tab.current { color: var(--text); }
.tab.current::after { content: ""; position: absolute; top: -7px; left: 14px; right: 14px; height: 3px; background: var(--ink); }
.dot { background: var(--accent); color: #fff; border-radius: 4px; }
.icon-btn { color: var(--text); border-radius: 999px; background: var(--chip); width: 44px; height: 44px; }
.icon-btn:hover { background: var(--line); }
.icon-btn.accent { background: var(--ink); color: var(--ink-on); }
.msg-btn.on { background: var(--ink); color: var(--ink-on); }
.me { background: var(--chip); color: var(--text); width: 44px; height: 44px; font-size: 13px; }
.rail { background: var(--bg); border-right: 1px solid var(--line); }
.rail-item { color: var(--muted); font-weight: 600; font-size: 11px; }
.rail-item.current { color: var(--text); }
.rail-item.current::before { content: ""; position: absolute; left: -8px; top: 8px; bottom: 8px; width: 4px; background: var(--ink); }
.listpane { border-right: 1px solid var(--line); }

/* Avatars: square department tiles, round people */
.avatar { width: 48px; height: 48px; }
.avatar.dept { border-radius: 4px; background: var(--hue); color: #fff; }
.frame[data-theme="dark"] .avatar.dept { color: #000; }
.avatar.person { border-radius: 999px; background: var(--chip); color: var(--text); font-weight: 800; }
.avatar.person::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; background: var(--hue); border: 2px solid var(--bg); border-radius: 3px; }
.avatar.sm::after { width: 9px; height: 9px; }

/* List: huge heading, full-width rows with dividers */
.list { padding: 0 16px 20px; }
.list-head { padding: 16px 0 10px; }
.list-title { font-size: 36px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.page-title { font-size: 40px; font-weight: 800; letter-spacing: -.03em; }
.search { background: var(--chip); border-radius: 999px; height: 48px; margin: 0 0 8px; padding: 0 16px; font-weight: 600; color: var(--text); }
.search input { color: var(--text); font-weight: 500; }
.search input::placeholder { color: var(--muted); }
.section-label { font-size: 20px; font-weight: 800; letter-spacing: -.02em; margin: 20px 0 4px; color: var(--text); }
.chat-row { min-height: 76px; padding: 12px 0; border-bottom: 1px solid var(--line); gap: 14px; }
.chat-row:hover { background: var(--hover); }
.chat-row.active { box-shadow: inset 4px 0 0 var(--ink); padding-left: 10px; }
.chat-name { font-weight: 700; font-size: 16px; }
.chat-preview { font-size: 14px; color: var(--muted); }
.chat-row.unread .chat-preview { color: var(--text); font-weight: 600; }
.chat-time { font-size: 13px; color: var(--muted); font-weight: 600; }
.badge { background: var(--accent); color: #fff; border-radius: 4px; height: 22px; min-width: 22px; }
.role { background: var(--ink); color: var(--ink-on); border-radius: 3px; text-transform: uppercase; font-size: 9px; padding: 2px 5px; letter-spacing: .06em; }

/* Thread: bold header, flat blocks */
.thread-head { padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--bg); }
.thread-title b { font-size: 18px; font-weight: 800; letter-spacing: -.02em; }
.day { font-weight: 800; color: var(--text); text-transform: uppercase; letter-spacing: .08em; font-size: 11px; }
.msg-author { font-weight: 800; font-size: 13px; color: var(--text); }
.bubble { background: var(--chip); border-radius: 8px; padding: 12px 14px; font-size: 15px; }
.msg.mine .bubble { background: var(--ink); color: var(--ink-on); }
.bubble.deleted { background: transparent; border: 2px solid var(--line); color: var(--muted); font-style: normal; font-weight: 600; }
.msg-time { font-weight: 600; }
.reply-quote { border-left: 4px solid var(--ink); background: transparent; padding-left: 10px; color: var(--muted); border-radius: 0; }
.photo { border-radius: 4px; }
.msg-more { color: var(--text); }
.menu { background: var(--bg); border: 2px solid var(--ink); border-radius: 8px; padding: 0; }
.menu button { min-height: 52px; padding: 0 16px; font-weight: 700; border-bottom: 1px solid var(--line); }
.menu .danger { color: var(--danger); }

/* Composer: big targets */
.composer-wrap { border-top: 1px solid var(--line); background: var(--bg); padding: 10px 12px 16px; }
.composer-input { background: var(--chip); border-radius: 999px; height: 52px; padding: 0 18px; font-size: 16px; }
.send { width: 52px; height: 52px; background: var(--accent); color: #fff; border-radius: 999px; }
.composer .icon-btn { width: 52px; height: 52px; }
.upload { border: 2px solid var(--ink); border-radius: 8px; }
.upload-info b { font-size: 14px; }
.upload-thumb { border-radius: 4px; }
.bar { background: var(--chip); height: 6px; }
.bar span { background: var(--accent); }

/* Dialog: bottom-heavy, full-width buttons */
.dialog { background: var(--bg); border-radius: 8px; padding: 24px; }
.dialog h2 { font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
.dialog-actions { flex-direction: column-reverse; gap: 8px; }
.btn { height: 52px; border-radius: 8px; background: var(--chip); font-weight: 700; font-size: 16px; }
.btn.danger { background: var(--danger); color: #fff; }
.offline { background: var(--ink); color: var(--ink-on); border-radius: 8px; }
.offline b { display: block; }
.safety { background: var(--chip); border-radius: 8px; font-weight: 600; }
.empty h2 { font-size: 28px; font-weight: 800; letter-spacing: -.02em; }
.empty-art { background: var(--ink); color: var(--ink-on); border-radius: 8px; }

/* Settings: big rows, segmented choice in black */
.settings { padding: 16px; }
.page .settings { padding: 40px 32px; }
.setting { border-bottom: 1px solid var(--line); padding: 18px 0; }
.setting h2 { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
.new { background: var(--accent); color: #fff; border-radius: 4px; }
.seg { background: var(--chip); border-radius: 999px; padding: 4px; }
.seg button { height: 44px; border-radius: 999px; font-weight: 700; }
.seg button[aria-checked="true"] { background: var(--ink); color: var(--ink-on); }
.push { background: var(--chip); border-radius: 8px; font-size: 14px; }
.push b { font-weight: 800; }
.mute-title { font-size: 16px; font-weight: 800; }
.mute-row { min-height: 56px; border-bottom: 1px solid var(--line); }
.switch { width: 48px; height: 28px; background: var(--line); }
.switch span { width: 22px; height: 22px; background: var(--bg); }
.mute-row[aria-checked="true"] .switch { background: var(--ink); }
.mute-row[aria-checked="true"] .switch span { transform: translateX(20px); }

/* Navigation options */
.nav-options h1 { font-size: 40px; font-weight: 800; letter-spacing: -.03em; }
.nav-card { border: 2px solid var(--line); border-radius: 8px; }
.nav-card.picked { border-color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
.mini { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.bell-panel { border: 2px solid var(--ink); border-radius: 8px; background: var(--bg); }
.bell-tabs span { border-radius: 999px; background: var(--chip); }
.bell-tabs .on { background: var(--ink); color: var(--ink-on); }
</style>
</head>
<body>
<div id="mock"></div>
<script>window.MOCK_OPTION = { id: "B", name: "Uber-inspired" };</script>
<script src="mock.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Your sign-in link</title>
  </head>
  <!-- The Calm design (decision 2026-11-05), as in lib/domain/email-design.ts. Paste into Supabase: README, step 4. -->
  <body style="margin:0;padding:0;background:#f5f5f7;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">
      Tap the button to sign in. The link works once and expires in an hour.
    </div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;">
      <tr>
        <td align="center" style="padding:48px 20px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;text-align:center;">
            <tr>
              <td align="center" style="padding-bottom:22px;">
                <img src="{{ .SiteURL }}/icons/icon-192.png" width="52" height="52" alt="IFC Production Academy" style="display:block;border:0;border-radius:14px;" />
              </td>
            </tr>
            <tr>
              <td style="padding-bottom:16px;">
                <h1 style="margin:0;font-size:30px;line-height:1.15;font-weight:600;letter-spacing:-0.02em;color:#1d1d1f;">Here's your sign-in link</h1>
              </td>
            </tr>
            <tr>
              <td>
                <p style="margin:0 0 14px;font-size:17px;line-height:1.5;color:#6e6e73;">Tap the button to sign in. The link works once and expires in an hour.</p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:14px 0 6px;">
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/home" style="display:inline-block;padding:13px 28px;border-radius:999px;background:#6d3fe0;color:#ffffff;font-size:16px;font-weight:500;text-decoration:none;">Sign in</a>
              </td>
            </tr>
            <tr>
              <td style="padding-top:30px;font-size:12px;line-height:1.6;color:#86868b;">
                If you didn't ask for this, you can ignore this email. Nobody can sign in without the link.<br />IFC Production Academy
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

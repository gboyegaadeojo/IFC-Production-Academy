<!doctype html>
<html lang="en">
  <body style="margin:0;padding:32px 20px;background:#000000;color:#F5F5F5;font-family:Inter,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;">
      <tr>
        <td>
          <p style="margin:0 0 8px;font-size:13px;color:#A3A3A3;">IFC Production Academy</p>
          <h1 style="margin:0 0 16px;font-size:24px;line-height:1.3;">Here's your sign-in link</h1>
          <p style="margin:0 0 24px;font-size:15px;line-height:1.5;color:#A3A3A3;">
            Tap the button to sign in. The link works once and expires in an hour.
          </p>
          <p style="margin:0 0 24px;">
            <a
              href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/home"
              style="display:inline-block;padding:12px 20px;border-radius:12px;background:#7C3AED;color:#FFFFFF;font-size:15px;font-weight:600;text-decoration:none;"
              >Sign in</a
            >
          </p>
          <p style="margin:0;font-size:13px;line-height:1.5;color:#8A8A8A;">
            If you didn't ask for this, you can ignore this email. Nobody can sign in without the link.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
